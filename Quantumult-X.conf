# Quantumult X base configuration template
# Project-authored routing rules are embedded below; no third-party rule feed is required.
# Back up your current configuration before importing this profile.

[general]
network_check_url=http://cp.cloudflare.com/generate_204
server_check_url=http://cp.cloudflare.com/generate_204
fallback_udp_policy=reject
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8

[dns]
; Uses system DNS by default. To use encrypted DNS, uncomment and choose a resolver you trust:
; doh-server=https://dns.google/dns-query
; prefer-doh3

[policy]
; Uses Quantumult X built-in policies proxy / direct / reject; no provider node groups are assumed.

[server_remote]
; No provider subscription URL was supplied. Add only a subscription from a provider you trust.

[filter_remote]
; Intentionally empty: active routing rules are first-party and embedded under [filter_local].

[rewrite_remote]
; Intentionally empty: no third-party app rewrite resource is loaded.

[filter_local]
; First-match order: curated proxy services -> selected mainland services -> geoip fallbacks -> proxy fallback.
