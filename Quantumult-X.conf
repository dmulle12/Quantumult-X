# Quantumult X 基础配置模板
# 说明：这是通用分流骨架。请在 Quantumult X 导入前备份现有配置，并填入可信服务商的节点订阅。
# 规则源由 dmulle12/rules 项目维护；改动策略前请先阅读 README.md。

[general]
network_check_url=http://cp.cloudflare.com/generate_204
server_check_url=http://cp.cloudflare.com/generate_204
fallback_udp_policy=reject
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8

[dns]
; 默认沿用系统 DNS。若要使用加密 DNS，请自行取消注释并选择信任的服务：
; doh-server=https://dns.google/dns-query
; prefer-doh3

[policy]
; 本模板使用 Quantumult X 内置策略 proxy / direct / reject，不臆造节点组。
; 如需自定义策略组，请先在 Quantumult X 中核对节点标签后再添加。

[server_remote]
; 未提供服务商订阅地址，因此不写入任何虚构 URL。
; 将服务商给你的 Quantumult X 订阅地址添加为一行，例如：
; https://provider.example/your-private-subscription, tag=MyProvider

[filter_remote]
; 优先级从上到下：广告/追踪拦截 -> 例外直连 -> 中国大陆直连 -> 代理名单
https://github.com/dmulle12/rules/raw/rel/reject.quanx, tag=Reject, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://github.com/dmulle12/rules/raw/rel/gfw-skip.quanx, tag=Direct-Exceptions, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://github.com/dmulle12/rules/raw/rel/loc-cn.quanx, tag=China-Direct, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://github.com/dmulle12/rules/raw/rel/gfw.quanx, tag=Proxy-Domains, force-policy=proxy, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

[rewrite_remote]
; 应用级重写默认关闭。需要时将目标行 enabled=false 改为 enabled=true。
; 部分重写需要 MitM；启用前阅读 docs/REWRITES.md 并确认自己接受证书解密范围。
https://github.com/dmulle12/rules/raw/rel/ext/bili.quanx, tag=Bilibili, update-interval=86400, enabled=false
https://github.com/dmulle12/rules/raw/rel/ext/wb.quanx, tag=Weibo, update-interval=86400, enabled=false
https://github.com/dmulle12/rules/raw/rel/ext/fq.quanx, tag=FQ-Reader, update-interval=86400, enabled=false

[filter_local]
; 局域网与中国大陆 IP 直连；其余未匹配流量走 proxy。
geoip, lan, direct
geoip, cn, direct
final, proxy

[rewrite_local]
; 仅放置你已审阅并确认适用于自己应用的本地重写规则。

[mitm]
; 不默认开启 HTTPS 解密。启用应用级重写前，请按 docs/REWRITES.md 操作。
; hostname = *.example.invalid
