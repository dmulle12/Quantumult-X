# Quantumult X profile with project-authored first-party remote routing rules.
# Back up your current configuration before importing this profile.

[general]
network_check_url=http://wifi.vivo.com.cn/generate_204
server_check_url=http://cp.cloudflare.com/generate_204
fallback_udp_policy=reject
geo_location_checker=http://ip-api.com/json/?fields=11024,https://github.com/dmulle12/rules/raw/main/js/qx-loc.js
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
# resource_parser_url=https://github.com/dmulle12/rules/raw/main/js/qx-extract.js
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.cmbchina.com
dns_reject_domain_behavior=nxdomain
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8

[dns]
;prefer-doh3
no-system
no-ipv6
server=8.8.8.8
server=8.8.4.4
doh-server=https://dns.google/dns-query

[policy]
; Uses Quantumult X built-in policies proxy / direct / reject; no provider node groups are assumed.
; Safe default is direct. Add your own mainland-capable node tag to use return-to-China routing.
; The generic proxy candidate is not guaranteed to be in mainland China.
static = BackCN, direct, proxy

[server_remote]
; No provider subscription URL was supplied. Add only a subscription from a provider you trust.

[filter_remote]
; BEGIN PROJECT REMOTE RULES (generated by tools/build_config.py; do not edit this block)
https://raw.githubusercontent.com/dmulle12/Quantumult-X/main/rulesets/back-cn-media.list, tag=Project-BackCN, force-policy=BackCN, update-interval=172800, enabled=true
https://raw.githubusercontent.com/dmulle12/Quantumult-X/main/rulesets/proxy-services.list, tag=Project-Proxy, force-policy=proxy, update-interval=172800, enabled=true
https://raw.githubusercontent.com/dmulle12/Quantumult-X/main/rulesets/direct-cn.list, tag=Project-Direct-CN, force-policy=direct, update-interval=172800, enabled=true
; END PROJECT REMOTE RULES

[rewrite_remote]
; Intentionally empty: no third-party app rewrite resource is loaded.

[filter_local]
; Local filters precede remote filters. Keep only the LAN override here; final is the fallback after remote rules.
geoip, lan, direct
final, proxy

[rewrite_local]
; No live app rewrite is installed. See snippets/rewrite-examples.snippet for reserved-domain syntax examples.

[mitm]
; HTTPS MitM is not enabled. Follow docs/REWRITES.md before configuring a certificate or hostname.
