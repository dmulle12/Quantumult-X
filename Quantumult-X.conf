# Quantumult X base configuration template
# General-purpose routing skeleton. Back up your current configuration before importing this into Quantumult X, and add a subscription from a provider you trust.
# Rules are maintained by the dmulle12/rules project; read README.md before changing policies.

[general]
network_check_url=http://cp.cloudflare.com/generate_204
server_check_url=http://cp.cloudflare.com/generate_204
fallback_udp_policy=reject
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8

[dns]
; Uses system DNS by default. To use encrypted DNS, uncomment and choose a service you trust:
; doh-server=https://dns.google/dns-query
; prefer-doh3

[policy]
; This template uses the built-in Quantumult X policies proxy / direct / reject; it does not invent node groups.
; To customize policy groups, verify your node tags in Quantumult X before adding them.

[server_remote]
; No provider subscription URL was supplied, so none is included here.
; Add the Quantumult X subscription URL provided by your provider on a line such as:
; https://provider.example/your-private-subscription, tag=MyProvider

[filter_remote]
; Priority from top to bottom: block ads/trackers -> direct exceptions -> mainland China direct -> proxy list
https://github.com/dmulle12/rules/raw/rel/reject.quanx, tag=Reject, force-policy=reject, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://github.com/dmulle12/rules/raw/rel/gfw-skip.quanx, tag=Direct-Exceptions, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://github.com/dmulle12/rules/raw/rel/loc-cn.quanx, tag=China-Direct, force-policy=direct, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true
https://github.com/dmulle12/rules/raw/rel/gfw.quanx, tag=Proxy-Domains, force-policy=proxy, update-interval=86400, opt-parser=false, inserted-resource=true, enabled=true

[rewrite_remote]
; App rewrites are disabled by default. Change enabled=false to enabled=true only for resources you need.
; Some rewrites require MitM. Read docs/REWRITES.md before enabling them and confirm you accept the certificate's decryption scope.
https://github.com/dmulle12/rules/raw/rel/ext/bili.quanx, tag=Bilibili, update-interval=86400, enabled=false
https://github.com/dmulle12/rules/raw/rel/ext/wb.quanx, tag=Weibo, update-interval=86400, enabled=false
https://github.com/dmulle12/rules/raw/rel/ext/fq.quanx, tag=FQ-Reader, update-interval=86400, enabled=false

[filter_local]
; Route LAN and mainland China IP addresses directly; send all unmatched traffic through proxy.
geoip, lan, direct
geoip, cn, direct
final, proxy

[rewrite_local]
; Add only local rewrite rules that you have reviewed and confirmed are appropriate for your apps.

[mitm]
; HTTPS decryption is not enabled by default. Follow docs/REWRITES.md before enabling app rewrites.
; hostname = *.example.invalid
